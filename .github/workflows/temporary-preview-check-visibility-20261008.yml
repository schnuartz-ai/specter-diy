name: Temporary Preview Check Visibility Comparison

on:
  pull_request:
    types: [edited]
  pull_request_target:
    types: [edited]

jobs:
  native-preview-check:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number == 10 }}
    name: Specter Browser Preview (native Actions control)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Show example preview links (from PR 4, not PR 10)
        run: |
          echo '### Checks visibility control (not a PR 10 firmware build)' >> "$GITHUB_STEP_SUMMARY"
          echo 'This **native GitHub Actions check** is the visibility control.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '[Working reference preview from PR 4](https://schnuartz-ai.github.io/specter-diy-web-simulator/pr/4/4ce6fb908a23c8ecaf9da540a95b1f0e97322cd5/)' >> "$GITHUB_STEP_SUMMARY"
          echo '[Matching PR 4 firmware artifact](https://github.com/schnuartz-ai/specter-diy-web-simulator/actions/runs/37754184825/artifacts/11538774787)' >> "$GITHUB_STEP_SUMMARY"
          echo '[Current PR 10](https://github.com/schnuartz-ai/specter-diy/pull/10)' >> "$GITHUB_STEP_SUMMARY"

  checks-api-probe:
    if: >-
      ${{ false }}
    name: Create custom checks via API (test only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Create app-owned checks for head and merge SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          repo = os.environ["TARGET_REPO"]
          number = int(os.environ["PR_NUMBER"])
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "specter-check-visibility-control",
          }
          def gh(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = Request("https://api.github.com" + path, data=data, method=method, headers=headers)
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, json.loads(raw) if raw else {}
          _, pr = gh("GET", f"/repos/{repo}/pulls/{number}")
          if pr["state"] != "open":
              raise SystemExit("PR is not open, refusing to create new checks")
          preview = ("https://schnuartz-ai.github.io/specter-diy-web-simulator/pr/4/"
                     "4ce6fb908a23c8ecaf9da540a95b1f0e97322cd5/")
          firmware = ("https://github.com/schnuartz-ai/specter-diy-web-simulator/"
                      "actions/runs/37754184825/artifacts/11538774787")
          summary = ("Temporary association test, **not a firmware build for PR #10**.\\n\\n"
                     f"[Working sample browser preview (PR #4)]({preview})\\n\\n"
                     f"[Matching sample firmware artifact (PR #4)]({firmware})\\n\\n"
                     "We are comparing whether a manually created check on an external "
                     "head SHA vs a GitHub-generated merge SHA appears in PR #10.")
          for name, sha in [
              ("Specter Browser Preview — API external head", os.environ["HEAD_SHA"]),
              ("Specter Browser Preview — API merge commit", pr.get("merge_commit_sha")),
          ]:
              if not sha:
                  raise SystemExit("No SHA for " + name)
              payload = {
                  "name": name,
                  "head_sha": sha,
                  "status": "completed",
                  "conclusion": "neutral",
                  "details_url": preview,
                  "output": {"title": "Specter preview check placement test",
                             "summary": summary},
              }
              status, result = gh("POST", f"/repos/{repo}/check-runs", payload)
              print("CHECK_PROOF " + json.dumps({
                  "name": name, "head_sha": sha, "http": status,
                  "check_url": result.get("html_url"), "id": result.get("id"),
                  "associated_pull_requests": [
                      p.get("number") for p in result.get("pull_requests", [])
                  ],
              }), flush=True)
          PY

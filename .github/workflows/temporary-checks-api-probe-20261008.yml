name: Temporary Checks API fork-PR probe (2026-10-08)

on:
  pull_request_target:
    types: [edited, reopened]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  checks-api-probe:
    if: >-
      github.event.pull_request.number == 10 &&
      github.event.pull_request.base.repo.full_name == 'schnuartz-ai/specter-diy' &&
      github.event.pull_request.head.repo.full_name == 'cryptoadvance/specter-diy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create check runs on external head SHA and PR merge SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          base = os.environ["BASE_REPO"]
          token = os.environ["GH_TOKEN"]
          pr_number = int(os.environ["PR_NUMBER"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "specter-checks-api-probe",
          }

          def github(method, path, data=None):
              raw = json.dumps(data).encode() if data is not None else None
              req = Request("https://api.github.com" + path, data=raw,
                            method=method, headers=headers)
              if raw is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urlopen(req, timeout=30) as resp:
                      data = resp.read()
                      return resp.status, json.loads(data) if data else None
              except HTTPError as exc:
                  print(f"{method} {path}: HTTP {exc.code} — "
                        f"{exc.read().decode()[:800]}", flush=True)
                  return exc.code, None

          status, pr = github("GET", f"/repos/{base}/pulls/{pr_number}")
          if status != 200:
              raise SystemExit("Could not load test PR metadata")

          checks = [
              ("external-head", os.environ["HEAD_SHA"]),
              ("github-merge", pr.get("merge_commit_sha")),
          ]
          for label, sha in checks:
              if not sha:
                  print(f"{label}: NO_SHA", flush=True)
                  continue
              payload = {
                  "name": "Specter Preview Checks API probe (" + label + ")",
                  "head_sha": sha,
                  "status": "completed",
                  "conclusion": "neutral",
                  "details_url": f"https://github.com/{base}/pull/{pr_number}",
                  "output": {
                      "title": "Preview Checks API fork-PR association test",
                      "summary": ("Temporary non-blocking test check created for "
                                  + label + " commit `" + sha[:12] + "`. "
                                  "This is not a firmware build."),
                  },
              }
              code, result = github("POST", f"/repos/{base}/check-runs", payload)
              print("PROBE_RESULT " + json.dumps({
                  "label": label, "sha": sha, "http": code,
                  "check_id": result.get("id") if result else None,
                  "check_url": result.get("html_url") if result else None,
                  "pull_requests": [
                      p.get("number") for p in result.get("pull_requests", [])
                  ] if result else None,
              }), flush=True)
          PY
